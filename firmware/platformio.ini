; QuireOS firmware — PlatformIO project.
;   pio run -e t5pro -t upload      full firmware over USB
;   pio run -e t5pro-ota -t upload  full firmware over Wi-Fi (quireos.local)
;   pio run -e probe -t upload      board-layer probe (no OS core), see src/probe/probe_main.cpp
[platformio]
default_envs = t5pro
boards_dir = boards
src_dir = src
lib_dir = lib

[common]
flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DQUIREOS_BOARD_T5PRO
  -DQUIREOS_VERSION=\"0.1.0\"

[env]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3-Pro
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Mozilla CA bundle for WiFiClientSecure::setCACertBundle(); regenerate with
; src/boards/t5pro/certs/gen_crt_bundle.py (see spec/NOTES-t5pro.md).
board_build.embed_files = src/boards/t5pro/certs/x509_crt_bundle.bin
build_unflags = -std=gnu++11
build_flags = ${common.flags} -DCORE_DEBUG_LEVEL=1
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Full firmware: OS core + runtime + the t5pro board layer.
[env:t5pro]
build_src_filter = +<*> -<boards/host/> -<boards/_template/> -<probe/>

; Same firmware, uploaded over Wi-Fi to the running device (ArduinoOTA + mDNS).
[env:t5pro-ota]
extends = env:t5pro
upload_protocol = espota
upload_port = quireos.local

; Board-layer probe: only the HAL helpers, the t5pro devices and src/probe. QUIREOS_PROBE swaps the
; OS web handler for a stub so the board layer links without src/os.
[env:probe]
build_src_filter = +<hal/hal.cpp> +<boards/t5pro/> -<boards/t5pro/main.cpp> +<probe/>
build_flags = ${common.flags} -DQUIREOS_PROBE -DCORE_DEBUG_LEVEL=3
